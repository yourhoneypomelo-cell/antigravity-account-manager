[package]
name = "antigravity-account-manager"
version = "0.1.0"
description = "Antigravity Account Manager - Local Google account, credentials, 2FA and subscription manager"
authors = ["Antigravity Account Manager contributors"]
edition = "2021"
default-run = "antigravity-account-manager"

[[bin]]
name = "antigravity-account-manager"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[lib]
name = "antigravity_account_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
sha2 = "0.10"
base64 = "0.22"
csv = "1.3"
regex = "1.10"
thiserror = "1.0"
parking_lot = "0.12"
log = "0.4"
